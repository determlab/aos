# Processor manifest (spec §4.4). One capability set, one trigger, one policy.
processor: daily-calendar-summary
version: 0.2

requires:
  - cal_personal.read_events

blueprint: blueprints/daily-summary.yaml
engine: bricks

# The brick packs this processor may use, by `bricks.packs` entry point name.
# Installing a pack does not grant it: a pack that is not named here is absent
# from the registry, exactly like an ungranted capability (D8). Omitting this
# key is an error, not an empty list — see aos/packs.py.
packs:
  - stdlib

# The topology this processor reads through. lab.sim.yaml needs no network and
# no credentials; lab.yaml is the real calendar.
lab: lab.sim.yaml

trigger:
  cron: "0 7 * * *"

policy:
  grants_required: true

output:
  deliver: push
  target: "user:me"
