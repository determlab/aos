[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "determlab-aos"
version = "0.1.0"
description = "Purpose-built agent processors: one capability set, one trigger, one policy, declared in a manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The kernel's whole job is manifests, grants and run records. Everything the
# processors actually DO comes from the two sibling packages, so the dependency
# list is deliberately three lines and should stay that way.
dependencies = [
  "pyshal>=0.2.1",   # driver/resource layer: topology, transports, approval gate
  "pyyaml>=6.0",     # manifests, grants and lab.yaml are the interface
  "typer>=0.12",
]
# bricks is NOT listed: it is alpha, not on PyPI, and consumed from a pinned
# commit. See spec/v0.2.md section 8 step 5.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3,<0.17", "mypy>=1.8"]

[project.scripts]
aos = "aos.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aos*"]
namespaces = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Do not format Python blocks inside Markdown. Ruff 0.16 started doing this and
# turned determlab/bricks main red for every PR (bricks#14).
exclude = ["*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
